services:
  - type: web
    name: frigosmart
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    disk:
      name: frigosmart-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # lo inserisci manualmente nella dashboard Render
      - key: APP_PASSWORD
        sync: false          # la tua password personale per accedere all'app
      - key: DB_PATH
        value: /data/frigo.db
