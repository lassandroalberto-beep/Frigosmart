<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrigoSmart — Accesso</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f7f9f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 24px rgba(45,122,79,0.10);
            border: 1px solid #dde8df;
            text-align: center;
        }
        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: #2d7a4f;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #7a8c7e;
            font-size: 13px;
            margin-bottom: 28px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dde8df;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.15s;
            text-align: center;
            letter-spacing: 3px;
        }
        input[type="password"]:focus { border-color: #2d7a4f; }
        button {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            background: #2d7a4f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        button:hover { opacity: 0.88; }
        .errore {
            margin-top: 14px;
            padding: 10px;
            background: #fdecea;
            color: #d94f3d;
            border-radius: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🥦 FrigoSmart</div>
        <div class="subtitle">La tua dispensa intelligente</div>

        <form method="POST">
            <input type="password" name="password" placeholder="Password" autofocus>
            <button type="submit">Accedi</button>
        </form>

        {% if errore %}
        <div class="errore">🔒 {{ errore }}</div>
        {% endif %}
    </div>
</body>
</html>
